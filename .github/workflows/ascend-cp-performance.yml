name: ascend-cp-performance

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline ref from this repository
        default: main
        required: true
        type: string
      suite:
        description: Benchmark matrix
        default: pr
        required: true
        type: choice
        options:
          - pr
          - full
      profile:
        description: Candidate iteration count
        default: final
        required: true
        type: choice
        options:
          - candidate
          - final
  pull_request:
    branches:
      - main
    paths:
      - "fla/ops/cp/**"
      - "fla/ops/gated_delta_rule/**"
      - "fla/modules/conv/**"
      - "fla/modules/backends/triton_ascend/**"
      - "benchmarks/cp/**"

jobs:
  paired-regression:
    name: Paired Ascend CP regression
    runs-on: linux-aarch64-a2-8
    timeout-minutes: 180
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    container:
      image: ascendai/cann:9.0.0-910b-ubuntu22.04-py3.11
      options: --shm-size 16g
    env:
      FLA_ASCEND_CP_GDN_PRECISION: high
      FLA_ASCEND_CONV_PRECISION: high
      ASCEND_UB_CAPACITY_BITS: "1572864"
      HCCL_NPU_SOCKET_PORT_RANGE: auto

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7.0.0

      - name: Checkout baseline
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'main' }}
          path: _baseline

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install pybind11 cmake attrs sympy pyyaml scipy decorator einops
          python -m pip install ".[npu,test]" \
            --extra-index-url=https://triton-ascend.osinfra.cn/pypi/simple

      - name: Run paired benchmark in both orders
        shell: bash
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          mkdir -p test-results
          python benchmarks/cp/run_ascend_cp_regression.py \
            --baseline-worktree _baseline \
            --candidate-worktree . \
            --platform npu \
            --suite "${{ inputs.suite || 'pr' }}" \
            --profile "${{ inputs.profile || 'candidate' }}" \
            --output test-results/ascend-cp-regression.json \
            2>&1 | tee test-results/ascend-cp-regression.log

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ascend-cp-performance-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            test-results
            /root/ascend/log
            /github/home/ascend/log
