name: ascend-a2-ci

# Pinned stack: CANN 9.0.0 + pyproject [npu] extra (torch/torch_npu/torchvision/triton-ascend)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "fla/ops/cp/**"
      - "fla/ops/gated_delta_rule/**"
      - "fla/modules/conv/**"
      - "fla/modules/backends/triton_ascend/**"
      - "fla/ops/backends/**"
      - "fla/utils/**"
      - "tests/context_parallel/**"
      - "tests/modules/*conv*ascend*"
      - "benchmarks/cp/**"
      - "pyproject.toml"
      - ".github/workflows/ascend-*.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]
    paths:
      - "fla/ops/cp/**"
      - "fla/ops/gated_delta_rule/**"
      - "fla/modules/conv/**"
      - "fla/modules/backends/triton_ascend/**"
      - "fla/ops/backends/**"
      - "fla/utils/**"
      - "tests/context_parallel/**"
      - "tests/modules/*conv*ascend*"
      - "benchmarks/cp/**"
      - "pyproject.toml"
      - ".github/workflows/ascend-*.yml"

jobs:
  test-a2-npu-pytorch-2-7:
    name: Test A2 NPU (PyTorch 2.7.1)
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
        os:
          - "linux-aarch64-a2-8"

    runs-on: ${{ matrix.os }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    container:
      image: ascendai/cann:9.0.0-910b-ubuntu22.04-py3.11
      options: >-
        --shm-size 16g
      env:
        HF_ENDPOINT: https://hf-mirror.com

    env:
      FLA_CI_ENV: 1
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      ASCEND_UB_CAPACITY_BITS: "1572864"
      HCCL_NPU_SOCKET_PORT_RANGE: auto
      FLA_ASCEND_CP_GDN_PRECISION: high
      FLA_ASCEND_CONV_PRECISION: high

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Check NPU and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -m)"-linux/ascend_toolkit_install.info
          npu-smi info

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          # triton-ascend runtime/build deps; install before resolving [npu] extra
          python -m pip install pybind11 cmake attrs sympy pyyaml scipy decorator einops
          # [npu] extra pins torch / torch_npu / torchvision / triton-ascend; osinfra index
          # hosts triton-ascend wheels (see INSTALL.md).
          python -m pip install ".[npu,test]" \
            --extra-index-url=https://triton-ascend.osinfra.cn/pypi/simple

      - name: Verify environment
        shell: bash
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python - <<'PY'
          import torch
          import torch_npu

          print("torch:", torch.__version__)
          print("torch_npu:", torch_npu.__version__)
          print("npu available:", torch.npu.is_available())

          import triton
          print("triton:", triton.__version__)

          from fla.utils import IS_NPU, device_platform
          print("device_platform:", device_platform)
          assert IS_NPU, "Expected NPU backend (IS_NPU=True)"
          PY

      - name: Run CP protocol and coverage contracts
        shell: bash
        run: |
          set -o pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          mkdir -p test-results
          pytest -s -v --exitfirst \
            --junitxml=test-results/cp-protocol.xml \
            tests/context_parallel/test_cp_context.py \
            tests/context_parallel/test_cp_benchmark_runner.py \
            tests/modules/test_conv_ascend_coverage.py \
            2>&1 | tee test-results/cp-protocol.log

      - name: Run single-NPU GDN and Conv kernels
        shell: bash
        env:
          FLA_NPU_XDIST: "1"
        run: |
          set -o pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          pytest -s -v --exitfirst -n 8 --dist loadfile \
            -m "ascend_npu and not nightly and not cp_distributed" \
            --junitxml=test-results/single-npu.xml \
            tests/context_parallel/test_cp_gdn_preprocess.py \
            tests/modules/test_conv_triton_ascend.py \
            2>&1 | tee test-results/single-npu.log

      - name: Run exclusive CP2 and CP4 gates
        timeout-minutes: 60
        shell: bash
        env:
          FLA_NPU_XDIST: "0"
        run: |
          set -o pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          pytest -s -v --exitfirst -n 0 \
            --junitxml=test-results/cp2-cp4.xml \
            tests/context_parallel/test_cp_gdn.py::test_cp2_fp16_chunk16_gva_tail \
            tests/context_parallel/test_cp_gdn.py::test_cp2_fused_gate_beta_qk_norm \
            tests/context_parallel/test_cp_gdn.py::test_cp4_complex \
            tests/context_parallel/test_cp_gdn_preprocess.py::test_non_gdn_cp4_primitive \
            tests/context_parallel/test_cp_conv.py::test_cp2_bfloat16_target_smoke \
            tests/context_parallel/test_cp_conv.py::test_cp4_multi_hop_short_local_chunk \
            tests/context_parallel/test_cp_conv.py::test_cp_noncontiguous_subgroup \
            2>&1 | tee test-results/cp2-cp4.log

      - name: Run exclusive CP8 high-precision gates
        timeout-minutes: 45
        shell: bash
        env:
          FLA_NPU_XDIST: "0"
        run: |
          set -o pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          pytest -s -v --exitfirst -n 0 \
            -m "cp8 and not nightly" \
            --junitxml=test-results/cp8.xml \
            tests/context_parallel/test_cp_gdn.py \
            tests/context_parallel/test_cp_conv.py \
            2>&1 | tee test-results/cp8.log

      - name: Upload CP logs and CANN plog
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ascend-cp-pr-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            test-results
            /root/ascend/log
            /github/home/ascend/log
